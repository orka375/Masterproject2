<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="UR5 robot">
  <!--
    Simplified UR5-like manipulator.
    Groups are named so individual joints/links can later be rotated
    from HMI_ROB._jointpos (transform-origin set per group).
  -->
  <defs>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe4ea"/>
      <stop offset="0.5" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#c8ccd1"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2f6fb0"/>
    </linearGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="200" cy="500" rx="120" ry="16" fill="#000000" opacity="0.15"/>

  <g id="robot-base">
    <rect x="140" y="470" width="120" height="30" rx="8" fill="#2b2f33"/>
    <rect x="158" y="440" width="84" height="36" rx="10" fill="url(#link)" stroke="#b0b6bd"/>
  </g>

  <g id="joint-1">
    <ellipse cx="200" cy="440" rx="46" ry="18" fill="url(#joint)"/>
  </g>

  <g id="link-1">
    <rect x="176" y="300" width="48" height="150" rx="20" fill="url(#link)" stroke="#b0b6bd"/>
  </g>

  <g id="joint-2">
    <circle cx="200" cy="300" r="30" fill="url(#joint)"/>
    <circle cx="200" cy="300" r="10" fill="#1b3a5b"/>
  </g>

  <g id="link-2">
    <rect x="196" y="170" width="150" height="44" rx="20" fill="url(#link)" stroke="#b0b6bd"
          transform="rotate(-58 200 300)"/>
  </g>

  <g id="joint-3">
    <circle cx="120" cy="192" r="26" fill="url(#joint)"/>
    <circle cx="120" cy="192" r="9" fill="#1b3a5b"/>
  </g>

  <g id="link-3">
    <rect x="120" y="150" width="40" height="120" rx="18" fill="url(#link)" stroke="#b0b6bd"
          transform="rotate(52 120 192)"/>
  </g>

  <g id="joint-4">
    <circle cx="196" cy="118" r="22" fill="url(#joint)"/>
    <circle cx="196" cy="118" r="8" fill="#1b3a5b"/>
  </g>

  <g id="joint-5">
    <circle cx="196" cy="82" r="19" fill="url(#joint)"/>
    <circle cx="196" cy="82" r="7" fill="#1b3a5b"/>
  </g>

  <g id="joint-6">
    <rect x="180" y="52" width="32" height="26" rx="6" fill="url(#link)" stroke="#b0b6bd"/>
  </g>

  <g id="tool">
    <rect x="188" y="34" width="16" height="20" rx="3" fill="#2b2f33"/>
    <circle cx="196" cy="30" r="6" fill="#e05d44"/>
  </g>
</svg>
